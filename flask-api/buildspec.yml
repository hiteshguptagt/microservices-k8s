version: 0.2

phases:
  install:
    commands:
      - echo Installing AWS CLI and Docker...
      - aws --version
      - docker --version

  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 024848451374.dkr.ecr.ap-south-1.amazonaws.com

  build:
    commands:
      - echo Building the Docker image...
      - docker build -t python-app .

  post_build:
    commands:
      - echo Tagging the Docker image...
      - docker tag python-app:latest 024848451374.dkr.ecr.ap-south-1.amazonaws.com/python-app:latest
      - echo Pushing the Docker image to ECR...
      - docker push 024848451374.dkr.ecr.ap-south-1.amazonaws.com/python-app:latest

artifacts:
  files:
    - '**/*'
  discard-paths: yes

